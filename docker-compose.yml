services:
  db:
    image: mysql:8.0.46
    container_name: uas_lab_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lab_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uas_lab_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Inventaris Lab"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/app/storage
    networks:
      - lab_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uas_lab_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - lab_net

volumes:
  db_data:
    name: uas_lab_db_data
  backend_storage:
    name: uas_lab_backend_storage

networks:
  lab_net:
    name: uas_lab_net
