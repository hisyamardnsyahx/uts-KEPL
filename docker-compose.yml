services:
  db:
    image: mysql:8.0.46
    container_name: uas_lab_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Tugas 6: batasi ukuran log container (json-file). Tanpa batas,
    # satu container yang menulis log terus-menerus bisa menghabiskan
    # disk laptop. 10 MB per berkas, 3 berkas = maksimal ~30 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uas_lab_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Inventaris Lab"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      # Tugas 6: log Laravel keluar ke stdout (channel 'stdout',
      # JSON satu baris), bukan ke berkas di dalam container.
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: array
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/app/storage
    # Tugas 6: healthcheck backend. Yang diperiksa bukan "container
    # menyala", melainkan /health yang memeriksa basis data + cache
    # (200 = healthy, 503 = unhealthy). start_period 40 detik memberi
    # waktu entrypoint menyelesaikan migrate + seed pertama kali;
    # interval 10 detik, timeout 5 detik, retries 5.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uas_lab_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    # Tugas 6: batas ukuran log, sama seperti layanan lain.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  # ---- Tugas 7: monitoring (Prometheus + Grafana + cAdvisor +
  # node-exporter), dalam satu file compose yang sama dengan aplikasi.
  # Semua versi image dikunci (bukan latest): dashboard yang tiba-tiba
  # rusak karena Grafana naik versi sendiri adalah kejutan yang tidak
  # menyenangkan. Port 9090 dan 3000 hanya dibuka di laptop (localhost);
  # jangan dibuka ke internet, isinya memberi tahu orang luar banyak
  # hal tentang sistem ini.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: uas_lab_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      # Volume ini wajib: tanpa prom-data, seluruh riwayat metrik
      # hilang tiap kali container diganti, dan riwayat justru inti
      # dari memantau.
      - prom-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: uas_lab_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Tugas 7: password admin Grafana TIDAK BOLEH admin/admin.
      # Nilainya dibaca dari .env (GRAFANA_PASS); contohnya ada di
      # .env.example sebagai placeholder, bukan nilai asli. Kalau
      # dibiarkan admin/admin, siapa pun yang bisa menjangkau port
      # 3000 masuk sebagai admin, dan kriteria keamanan dasar (10%)
      # gugur. Lihat Bab keamanan di laporan P11.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:-ganti-password-ini-di-env}
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisioning: data source dan dashboard dimuat dari berkas
      # saat Grafana menyala, jadi tidak ada langkah manual
      # "tambahkan Prometheus dulu" dan dashboard tidak hilang
      # bersama volume. Dashboard yang dibuat dengan klik dan hanya
      # hidup di volume akan hilang begitu volume dihapus.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uas_lab_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # Port host 8081 (bukan 8080): port 8080 di host sudah dipakai
    # frontend. Prometheus menjangkau cAdvisor lewat jaringan Compose
    # (cadvisor:8080), jadi port host-nya tidak memengaruhi scrape.
    ports:
      - "8081:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: uas_lab_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lab_net

volumes:
  db_data:
    name: uas_lab_db_data
  backend_storage:
    name: uas_lab_backend_storage
  # Tugas 7: volume data monitoring. Tanpa keduanya, riwayat
  # Prometheus dan susunan Grafana hilang tiap kali container diganti.
  prom-data:
    name: uas_lab_prom_data
  grafana-data:
    name: uas_lab_grafana_data

networks:
  lab_net:
    name: uas_lab_net
