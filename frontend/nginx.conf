server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: semua rute non-API kembali ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Kunci arsitektur: browser hanya memanggil origin frontend ini.
    # Nginx (yang berada di jaringan Docker Compose yang sama) meneruskan
    # /api ke service bernama "backend" -- bukan IP laptop, bukan localhost
    # host. Nama service ini hanya bisa di-resolve di dalam jaringan compose.
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
